<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health.Lab Model – renders</title><link rel="stylesheet" href="style.css?v=1085">
<style>
  main { max-width: 1400px; margin: 0 auto; padding: 72px 16px 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .grid figure { margin: 0; cursor: zoom-in; } .grid img { width: 100%; border-radius: 8px; display: block; }
  figcaption { color: var(--muted); font-size: 13px; padding: 4px 2px; }
  #lb { position: fixed; inset: 0; background: #000e; display: none; place-items: center; z-index: 20; cursor: zoom-out; }
  #lb img { max-width: 100vw; max-height: 100vh; }
  .ver { position: static; display: block; text-align: right; margin-top: 24px; }
</style></head>
<body>
<header><b>Health.Lab Model</b><a id="nav-index" href="index.html">Overview</a><a id="nav-model" href="model.html">Model</a><a id="nav-hybrid" href="splat.html">Hybrid splat</a><a id="nav-gaussian" href="splat.html?s=original">Gaussian splat</a><a id="nav-fbx" href="fbx.html">Visualize FBX</a><a class="on" id="nav-renders" href="renders.html">Renders</a></header>
<main><div class="grid" id="g"></div><div class="ver">ver 1.0.8 Beta</div></main>
<div id="lb"><img alt=""></div>
<script>
const R = [["living_room_windows", "Living room"], ["living_room_corner", "Living room – corner"], ["kitchen", "Kitchen"], ["bedroom", "Bedroom"],
  ["bedroom_wardrobe", "Bedroom – wardrobe"], ["bedroom_door", "Bedroom door"], ["bathroom", "Bathroom"], ["bathroom_shower", "Bathroom – shower"],
  ["bathroom_door", "Bathroom – door"], ["bathroom_entrance", "Bathroom entrance"], ["entrance_hall", "Entrance hall"], ["dollhouse", "Top view"],
  ["table2_living_room_windows", "Table in position 2 – living room"], ["table2_kitchen", "Table in position 2 – kitchen"],
  ["table2_living_room_corner", "Table in position 2 – corner"], ["floor_plan", "Floor plan in metres + WishCaptury cameras + mat by the pillar"],
  ["c3d_check", "Check: a Captury recording (unknown.c3d) inside the flat"]];
const g = document.getElementById("g"), lb = document.getElementById("lb");
for (const [f, t] of R) {
  const fig = document.createElement("figure");
  fig.innerHTML = `<img src="renders/${f}_m.jpg?v=1085" alt="${t}" loading="lazy"><figcaption>${t}</figcaption>`;
  fig.onclick = () => { lb.querySelector("img").src = `renders/${f}.jpg?v=1085`; lb.style.display = "grid"; };
  g.appendChild(fig);
}
lb.onclick = () => lb.style.display = "none";
addEventListener("keydown", e => { if (e.key === "Escape") lb.style.display = "none"; });
</script>
</body></html>
