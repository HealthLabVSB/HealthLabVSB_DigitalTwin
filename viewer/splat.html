<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health.Lab Model – splat</title><link rel="stylesheet" href="style.css?v=108">
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"}}</script>
</head>
<body>
<header><b>Health.Lab Model</b><a id="nav-index" href="index.html">Overview</a><a id="nav-model" href="model.html">Model</a><a id="nav-hybrid" href="splat.html">Hybrid splat</a><a id="nav-gaussian" href="splat.html?s=original">Gaussian splat</a><a id="nav-fbx" href="fbx.html">Visualize FBX</a><a id="nav-renders" href="renders.html">Renders</a>
  <span style="flex:1"></span>
  <a id="s-hybrid" href="?s=hybrid">Hybrid</a><a id="s-hybrid_no_ceiling" href="?s=hybrid_no_ceiling">Hybrid, no ceiling</a><a id="s-original" href="?s=original">Gaussian splat</a>
  <a id="table" href="#">Table: position 1/2</a></header>
<div id="view"></div><div id="msg"><span>Loading the splat…</span></div><div class="ver">ver 1.0.8 Beta</div>
<div class="help" id="help"></div>
<div class="bar" id="bar"></div>
<script type="module">
import * as THREE from "three";
import * as GS from "@mkkellogg/gaussian-splats-3d";
const VER = "108";
// hybrid = gaussians sampled from the clean model (sharp, complete); original = the captured 3D Gaussian Splatting reconstruction
const Q = new URLSearchParams(location.search); const which = Q.get("s") || "hybrid";
const ORIG = which === "original", POS = Q.get("table") === "2" && !ORIG ? "_table2" : "";
document.getElementById(ORIG ? "nav-gaussian" : "nav-hybrid").classList.add("on");
document.getElementById("s-" + which)?.classList.add("on");
document.getElementById("msg").innerHTML = `<span>Loading the ${ORIG ? "Gaussian splat (~15 MB)" : "hybrid splat (~50 MB)"}, please wait…</span>`;
document.getElementById("help").textContent = (ORIG ? "The original Gaussian splat as captured (real textures and clutter, softer geometry, no table position 2). " :
  "Hybrid splat: gaussians sampled from the model, so walls and furniture are sharp and complete. ") +
  "Left button = orbit · right = pan · wheel = zoom · buttons below = render viewpoints";
const tb = document.getElementById("table");
if (ORIG) tb.style.display = "none";
tb.textContent = POS ? "Table: position 2 → 1" : "Table: position 1 → 2";
tb.onclick = (e) => { e.preventDefault(); const u = new URL(location.href); u.searchParams.set("table", POS ? "1" : "2"); location.href = u.toString(); };
const cams = (await (await fetch("views.json?v=" + VER)).json()).splat;
const start = which === "hybrid_no_ceiling" ? cams["Top view"] : cams["Living room corner"];
const viewer = new GS.Viewer({ rootElement: document.getElementById("view"), cameraUp: [0, -1, 0],
  initialCameraPosition: start[0], initialCameraLookAt: start[1], sharedMemoryForWorkers: false, dynamicScene: false });
viewer.camera.fov = 68; viewer.camera.near = 0.03; viewer.camera.updateProjectionMatrix();
await viewer.addSplatScene(which + POS + ".splat?v=" + VER, { format: GS.SceneFormat.Splat, showLoadingUI: false, progressiveLoad: false });
document.getElementById("msg").textContent = "";
viewer.start();
const bar = document.getElementById("bar");
for (const [name, [p, t]] of Object.entries(cams)) {
  const b = document.createElement("button"); b.textContent = name;
  b.onclick = () => { viewer.camera.position.set(...p); viewer.controls.target.set(...t); viewer.controls.update();
    bar.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
  bar.appendChild(b);
}
</script>
</body></html>
